training:
  dqn:
    state_dim: 69             # 64 GNN embed + 5 packet features
    action_dim: 5             # N, S, E, W, Hold
    hidden_dims: [256, 128]
    lr: 0.001
    gamma: 0.99               # Discount factor
    replay_capacity: 100000
    batch_size: 64
    target_update_freq: 500   # Hard update every N steps
    eps_start: 1.0
    eps_end: 0.05
    eps_decay_steps: 10000
    episodes: 2000
    max_consecutive_holds: 3
    # Reward coefficients
    alpha_drop: 10.0          # Penalty for packet drop
    beta_util: 0.5            # Reward for reducing link utilisation
    # PER parameters
    per_alpha: 0.6
    per_beta_start: 0.4
    per_beta_end: 1.0
    per_beta_anneal_steps: 50000
    # Joint training
    gnn_lr_joint: 0.0001     # Lower LR for GNN in joint training
