training:
  gnn:
    in_channels: 8
    hidden_channels: 128
    out_channels: 64
    num_layers: 3
    dropout: 0.1
    lr: 0.001
    weight_decay: 0.0001
    epochs: 100
    batch_size: 32
    patience: 10
    num_episodes: 1000       # Training episodes per topology
    train_split: 0.8
    val_split: 0.1
    test_split: 0.1
